name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Locate Android project root
        id: locate
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android-project/settings.gradle.kts" ]; then
            echo "dir=android-project" >> "$GITHUB_OUTPUT"
          elif [ -f "KafilBeneficiaryRegistry/settings.gradle.kts" ]; then
            echo "dir=KafilBeneficiaryRegistry" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find settings.gradle.kts" >&2
            exit 1
          fi

      - name: Build Debug APK
        run: gradle -p "${{ steps.locate.outputs.dir }}" assembleDebug --no-daemon --stacktrace

      - name: Build Unsigned Release APK
        run: gradle -p "${{ steps.locate.outputs.dir }}" assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafil-beneficiaries-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Unsigned Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafil-beneficiaries-release-unsigned-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
